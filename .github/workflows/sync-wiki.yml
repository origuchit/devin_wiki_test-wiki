name: Wikiリポジトリへの同期（履歴クリーン）

on:
  workflow_dispatch: # 手動実行用ボタン

jobs:
  sync-clean-push:
    runs-on: ubuntu-latest
    steps:
      # 1. ソースコードの取得（全履歴）
      - name: Checkout source (Mirror)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. すべてのブランチとタグを取得
      - name: Fetch all branches and tags
        run: |
          git fetch --all --tags
          echo "✅ すべてのブランチとタグを取得しました"

      # 3. リモートブランチをローカルブランチとして作成（master/release/developを含むブランチのみ、日付付きは最新のみ）
      - name: Create local branches from remote branches
        run: |
          echo "📋 リモートブランチをローカルブランチとして作成中..."
          echo "   ※ master、release、developを含むブランチのみを対象とします"
          echo "   ※ 日付付きブランチ（例: develop/r20240326）は最新から2つを取得します"
          
          # リモートブランチを取得（origin/を除く）
          ALL_BRANCHES=$(git branch -r | grep -v 'origin/HEAD' | sed 's|origin/||' | \
            grep -E '(master|release|develop|main)')
          
          # 日付なしのブランチ（master、develop、release、main）を取得
          BASE_BRANCHES=$(echo "$ALL_BRANCHES" | grep -vE '/(develop|release)/r[0-9]' | grep -E '(master|develop|release|main)$' || true)
          
          # 日付付きブランチをグループ化して最新から2つを取得
          # develop / release を含み、ブランチ名内に日付(YYYYMMDD)が含まれるものを対象
          # 例: develop/r20240326, develop/20240326_xxx, release/fix_2024/12/24_release 等
          LATEST_DATED_BRANCHES=""
          DATED_BRANCHES=$(echo "$ALL_BRANCHES" | grep -E '(develop|release)' || true)
          if [ -n "$DATED_BRANCHES" ]; then
            # デバッグ出力（上位5件）
            echo "📅 検出された develop/release を含むブランチ例:"
            echo "$DATED_BRANCHES" | head -5 | sed 's/^/  - /'
            echo ""
            
            LATEST_DATED_BRANCHES=$(echo "$DATED_BRANCHES" | \
              awk -F'/' '
              {
                branch = $0
                # develop または release を含むものだけ対象
                if (index(branch, "develop") == 0 && index(branch, "release") == 0) next
                
                # プレフィックスは先頭セグメント（案件名想定）
                prefix = $1
                
                # ブランチ名から数字だけを抽出し、先頭8桁を日付候補として扱う
                digits = branch
                gsub(/[^0-9]/, "", digits)
                if (length(digits) < 8) next
                date = substr(digits, 1, 8)
                
                # YYYYMMDD の形式かつ 20xx 年に限定
                if (date !~ /^20[0-9]{6}$/) next
                
                # プレフィックスごとに日付->ブランチ名を保持
                branches[prefix, date] = branch
                dates[prefix] = dates[prefix] " " date
              }
              END {
                for (p in dates) {
                  split(dates[p], arr, " ")
                  n = asort(arr)
                  count = 0
                  for (i = n; i >= 1 && count < 2; i--) {
                    d = arr[i]
                    if (d == "") continue
                    print branches[p, d]
                    count++
                  }
                }
              }')
          fi
          
          # すべての対象ブランチを結合
          TARGET_BRANCHES=$(echo -e "$BASE_BRANCHES\n$LATEST_DATED_BRANCHES" | grep -v '^$' | sort -u)
          
          BRANCH_COUNT=$(echo "$TARGET_BRANCHES" | grep -c . || echo "0")
          echo ""
          echo "📋 対象ブランチ（${BRANCH_COUNT}個）:"
          echo "$TARGET_BRANCHES" | sed 's/^/  - /'
          echo ""
          
          # mainブランチが存在するか確認
          MAIN_EXISTS=false
          if echo "$TARGET_BRANCHES" | grep -q "^main$"; then
            MAIN_EXISTS=true
          fi
          
          for branch in $(echo "$TARGET_BRANCHES"); do
            # mainブランチは既に存在するのでスキップ
            if [ "$branch" != "main" ]; then
              echo "  作成中: $branch"
              git checkout -b "$branch" "origin/$branch" 2>/dev/null || echo "    (既に存在または作成済み)"
            fi
          done
          
          # mainブランチに戻る（存在する場合）
          if [ "$MAIN_EXISTS" = true ]; then
            git checkout main 2>/dev/null || echo "⚠️  mainブランチへの切り替えに失敗しました"
          else
            # mainブランチが存在しない場合、最初のブランチに戻る
            FIRST_BRANCH=$(echo "$TARGET_BRANCHES" | head -1)
            if [ -n "$FIRST_BRANCH" ]; then
              echo "⚠️  mainブランチが存在しないため、最初のブランチ（$FIRST_BRANCH）に戻ります"
              git checkout "$FIRST_BRANCH" 2>/dev/null || echo "⚠️  ブランチへの切り替えに失敗しました"
            fi
          fi
          
          echo ""
          echo "📋 ローカルブランチ一覧:"
          git branch --list
          echo ""
          echo "✅ 対象ブランチをローカルに作成しました"

      # 【安全対策A】メインリポジトリへの接続を物理的に切断
      # これにより、この後の工程で間違ってメイン側にpushすることは不可能になります
      - name: 🛡️ Safety Guard (Remove Origin)
        run: |
          echo "ソースリポジトリへの接続を解除しています..."
          git remote remove origin
          
          # 確認: originが消えているかチェック
          if git remote | grep -q "^origin$"; then
            echo "❌ エラー: originの削除に失敗しました！"
            exit 1
          fi
          echo "✅ originを削除しました。安全に処理を続行します。"

      # 4. ツールインストール
      - name: Install git-filter-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install git-filter-repo
          git-filter-repo --version

      # 5. 履歴の浄化
      - name: Clean History (Remove Secrets)
        run: |
          set -e
          git config --global user.email "action@github.com"
          git config --global user.name "Wiki Sync Action"

          echo "🧹 リポジトリの履歴をクリーニング中..."
          
          # 削除前の履歴を確認（デバッグ用）
          echo "📋 削除前の履歴に含まれる機密ファイル:"
          git log --all --full-history --name-only --pretty=format: | grep -E '(\.env|credentials|secrets|keys|\.pem|\.key|\.p12|auth\.json)' | sort -u | head -20 || echo "  (なし)"

          # --- 削除対象ファイルの設定 ---
          # 追加要望のあった env系パターンを網羅しています
          git filter-repo \
            --path-glob '.env*' \
            --path-glob 'env.*' \
            --path-glob '.docker.env' \
            --path-glob '.docker.env.example' \
            --path-glob '*.env.example' \
            --path-glob '**/*.pem' \
            --path-glob '*.pem' \
            --path-glob '**/*.key' \
            --path-glob '*.key' \
            --path-glob '**/*.p12' \
            --path-glob '*.p12' \
            --path-glob 'auth.json' \
            --path 'tools/auto-if/hulft/setup/etc/chrony.keys' \
            --path 'tools/provisioning/bootstrapping/aws/cdk/.env.example' \
            --path 'tools/provisioning/orchestration/vendor/bundler/ruby/2.6.0/gems/multi_json-1.15.0/lib/multi_json/convertible_hash_keys.rb' \
            --path-glob '**/*credentials*.json' \
            --path-glob '*credentials*.json' \
            --path-glob '**/*secrets*.json' \
            --path-glob '*secrets*.json' \
            --path-glob '**/*keys*.json' \
            --path-glob '*keys*.json' \
            --path-glob '**/*secret*.json' \
            --path-glob '*secret*.json' \
            --path-glob '**/*password*.json' \
            --path-glob '*password*.json' \
            --path-glob '**/*token*.json' \
            --path-glob '*token*.json' \
            --path '.ssh' \
            --path-glob 'config/secrets.*' \
            --path 'config/remote.php' \
            --path 'storage/logs' \
            --path 'storage/framework' \
            --path 'storage/app/tmp' \
            --path 'storage/app/private' \
            --path 'storage/batch/logs' \
            --invert-paths \
            --force

          echo ""
          echo "📋 削除後の履歴確認:"
          echo "   機密ファイルが履歴に残っていないか確認中..."
          REMAINING=$(git log --all --full-history --name-only --pretty=format: | \
            grep -E '(\.env|credentials|secrets|keys|\.pem|\.key|\.p12|auth\.json)' | \
            grep -v '^\\.github/workflows/verify-secrets\\.yml$' | \
            sort -u || true)
          if [ -n "$REMAINING" ]; then
            echo "⚠️  警告: 以下のファイルが履歴に残っています:"
            echo "$REMAINING" | sed 's/^/  - /'
          else
            echo "  ✅ 機密ファイルは履歴から削除されました"
          fi

          echo "✨ リポジトリのサニタイズ（機密情報削除）が完了しました。"

      # 6. SSHキーのセットアップ
      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.WIKI_SYNC_SSH_KEY }}
        run: |
          set -e
          if [ -z "$SSH_KEY" ]; then
            echo "❌ エラー: WIKI_SYNC_SSH_KEY シークレットが設定されていません"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "✅ SSHキーのセットアップが完了しました。"

      # 7. Wikiリポジトリへの強制プッシュ
      - name: Push to Wiki Repo
        env:
          DEST_REPO: "git@github.com:origuchit/devin_wiki_test-wiki.git"
        run: |
          set -e
          
          # 既存のdestinationリモートがあれば削除
          if git remote | grep -q "^destination$"; then
            git remote remove destination
          fi
          
          # リモート追加（originではなくdestinationとして追加）
          git remote add destination "$DEST_REPO"
          
          # 情報表示
          echo "📦 Wikiリポジトリへプッシュしています..."
          echo "   送信先: $DEST_REPO"
          echo ""
          echo "📋 プッシュされるブランチ:"
          git branch --list | sed 's/^/  - /'
          echo ""
          echo "📋 プッシュされるタグ:"
          git tag --list | sed 's/^/  - /' || echo "  (タグなし)"
          echo ""
          
          # Push実行（すべてのブランチとタグをプッシュ）
          # destination にしか送れない状態になっています
          git push --mirror --force destination
          
          echo "✅ Wikiリポジトリへのプッシュに成功しました"

